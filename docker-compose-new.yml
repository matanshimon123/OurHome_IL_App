services:
  traefik:
    image: "traefik"
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_RUNNERS_ENABLED=true
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_PROXY_HOPS=1
    volumes:
      - n8n_data:/home/node/.n8n
      - /local-files:/files

  finance-app:
    build: /docker/finance-app
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.finance.rule=Host(`webapp.matanshimonwebapp.online`)
      - traefik.http.routers.finance.tls=true
      - traefik.http.routers.finance.entrypoints=web,websecure
      - traefik.http.routers.finance.tls.certresolver=mytlschallenge
      - traefik.http.services.finance.loadbalancer.server.port=5000
    environment:
      - DATABASE_PATH=/data/finance_tracker.db
      - SECRET_KEY=${FINANCE_APP_SECRET_KEY:?FINANCE_APP_SECRET_KEY must be set in .env}
      - DEFAULT_USER=admin
      - DEFAULT_PASS=admin
    volumes:
      - finance_data:/data

  ourhome:
    build: /docker/ourhome
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.ourhome.rule=Host(`new.matanshimonwebapp.online`)
      - traefik.http.routers.ourhome.tls=true
      - traefik.http.routers.ourhome.entrypoints=web,websecure
      - traefik.http.routers.ourhome.tls.certresolver=mytlschallenge
      - traefik.http.services.ourhome.loadbalancer.server.port=5000
    environment:
      - APP_ENV=production
      - DATABASE_PATH=/data/finance_tracker.db
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:?FIREBASE_API_KEY must be set in .env}
      - TZ=Asia/Jerusalem
    volumes:
      - ourhome_data:/data

volumes:
  traefik_data:
    external: true
  n8n_data:
    external: true
  finance_data:
    external: true
  ourhome_data: