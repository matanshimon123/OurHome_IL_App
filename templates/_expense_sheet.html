{# Shared add/edit expense sheet (Concept A keypad sheet). Include once per page and load js/expense-sheet.js. #}
<div class="sheet-ov" id="expSheet">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="expTitle">
    <div class="sheet-handle"></div>
    <div class="row between mb-1">
      <h3 id="expTitle" style="font-size:21px">💸 הוצאה חדשה</h3>
      <span class="chip cream flat" id="expWho">היום · {{ (session.display_name or '').split()[0] if session.display_name else '' }}</span>
    </div>
    <div class="kp-amt" aria-live="polite"><span>₪</span><b id="expAmt">0</b></div>
    <div class="label">קטגוריה</div>
    <div class="chip-scroll mb-2" id="expCats" role="radiogroup" aria-label="קטגוריה"></div>
    <div class="field exp-field">
      <label class="label" for="expDesc">על מה? <span class="muted" style="font-weight:700">(לא חובה)</span></label>
      <input class="input" type="text" id="expDesc" maxlength="120" placeholder="למשל: שופרסל, דלק, גן" autocomplete="off">
      <div class="hint exp-hint">אם משאירים ריק, נרשום את שם הקטגוריה</div>
    </div>
    <div class="field exp-field hidden" id="expDateWrap">
      <label class="label" for="expDate">📅 תאריך</label>
      <input class="input" type="date" id="expDate">
    </div>
    <div class="keys mt-2" id="expKeys">
      <button type="button" class="key">1</button><button type="button" class="key">2</button><button type="button" class="key">3</button>
      <button type="button" class="key">4</button><button type="button" class="key">5</button><button type="button" class="key">6</button>
      <button type="button" class="key">7</button><button type="button" class="key">8</button><button type="button" class="key">9</button>
      <button type="button" class="key alt" data-k=".">נקודה .</button><button type="button" class="key">0</button><button type="button" class="key alt" data-k="del">⌫ מחק</button>
    </div>
    <div class="exp-actions">
      <button type="button" class="btn coral" id="expSave"><span aria-hidden="true">💸</span><span id="expSaveT">הוספת ההוצאה</span></button>
      <button type="button" class="btn white exp-del hidden" id="expDelete"><span aria-hidden="true">🗑️</span><span>מחיקה</span></button>
    </div>
    <div class="sheet-actions" style="margin-top:8px">
      <button type="button" class="text-btn" data-close="expSheet">ביטול</button>
    </div>
  </div>
</div>
