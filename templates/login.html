{% extends "base.html" %}
{% block title %}התחברות - OurHome IL{% endblock %}
{% block content %}
<header class="hero hero-sun auth-hero pop">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="logo float"><img src="/static/icons/icon-192.png" alt=""></div>
  <h1>OurHome IL</h1>
  <p class="sub">הבית המשפחתי שלכם: הוצאות, קניות ותינוק במקום אחד</p>
</header>

<main class="sticker auth-card pop d1">
  <h2 style="font-size:22px;margin-bottom:14px">שמחים לראות אתכם 👋</h2>
  <form method="POST" autocomplete="on" id="loginForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label class="label" for="email">אימייל</label>
      <input class="input ltr" type="email" id="email" name="email" autocomplete="email" inputmode="email" placeholder="name@example.com" required>
    </div>
    <div class="field">
      <label class="label" for="password">סיסמה</label>
      <div class="input-wrap">
        <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" data-toggle-pw="password">👁 <span>הצג</span></button>
      </div>
    </div>
    <button type="submit" class="btn coral block lg mt-3">כניסה</button>
  </form>
  <div class="auth-links">
    <a href="{{ url_for('forgot_password') }}">שכחתי את הסיסמה</a>
    <a href="{{ url_for('register') }}">אין לכם חשבון? להרשמה</a>
  </div>
</main>
{% endblock %}
{% block scripts %}
<script>
  if (window.history && window.history.replaceState) window.history.replaceState(null, '', window.location.href);
  document.getElementById('loginForm').addEventListener('submit', function () { var b = this.querySelector('[type=submit]'); b.disabled = true; b.textContent = 'נכנסים…'; });
</script>
{% endblock %}
